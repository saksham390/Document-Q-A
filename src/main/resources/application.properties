spring.application.name=document-qa-system

# LLM and embedding provider. Set these in the environment before starting the app.
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# Pinecone connection. The starter uses the index host; environment is retained for
# compatibility with Pinecone accounts/integrations that still require it.
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX_NAME}
spring.ai.vectorstore.pinecone.host=${PINECONE_HOST:}
spring.ai.vectorstore.pinecone.environment=${PINECONE_ENVIRONMENT:us-east-1-aws}
spring.ai.vectorstore.pinecone.namespace=${PINECONE_NAMESPACE:default}
spring.ai.vectorstore.pinecone.initialize-schema=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.port=${SERVER_PORT:8081}
server.error.include-message=always
